<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f4d"><title>سند — لا يوجد اتصال</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f7fb;color:#0b1f4d;font-family:system-ui,sans-serif}main{max-width:360px;margin:24px;padding:32px;text-align:center;background:white;border-radius:24px}p{line-height:1.9;color:#64748b}a{display:inline-block;padding:14px 24px;background:#195be4;color:white;border-radius:12px;text-decoration:none}</style></head><body><main><h1>سند</h1><h2>تحتاج اتصال بالإنترنت</h2><p>اتصل بالإنترنت لعرض بياناتك وتسجيل الحضور أو إرسال الطلبات. لا يتم تسجيل أي إجراء أثناء انقطاع الاتصال.</p><a href="/">إعادة المحاولة</a></main></body></html>
