name: HR current-schema snapshot generation
on:
  push:
    branches: [ci/bootstrap-hr-checks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Compute verified Drizzle final snapshot
        run: node --experimental-strip-types ops/export-final-snapshot.mjs
